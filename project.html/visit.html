<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Book a Visit | Anthonia's Estates</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet" /><link rel="stylesheet" href="style.css" /></head>
  <body><div class="page-shell"><header class="topbar"><nav class="nav container" aria-label="Main navigation"><a href="index.html" class="brand" aria-label="Anthonia's Estates home"><span class="brand-mark">A</span><span class="brand-text">Anthonia's <strong>Estates</strong></span></a><a class="back-link" href="index.html">Back home</a></nav></header>
    <main class="visit-page container"><section class="directory-hero"><span class="eyebrow contact-eyebrow">Private viewings</span><h1>See the right home in person.</h1><p>Tell us what you would like to view and our team will help arrange a convenient time in Port Harcourt.</p></section><form class="visit-form"><label>Name<input required type="text" placeholder="Your name" /></label><label>Email<input required type="email" placeholder="you@example.com" /></label><label>Preferred area<select><option>GRA Phase 2</option><option>Old GRA</option><option>Peter Odili</option><option>Trans Amadi</option><option>Woji</option><option>Rumuola</option><option>Eliozu</option></select></label><label>Message<textarea rows="4" placeholder="Which property would you like to visit?"></textarea></label><button class="primary-btn" type="submit">Request a Visit</button><p class="form-success" hidden>Thank you. We will contact you to confirm your viewing.</p></form></main>
  </div><script>document.querySelector('.visit-form').addEventListener('submit', (event) => { event.preventDefault(); event.currentTarget.querySelector('.form-success').hidden = false; event.currentTarget.reset(); });</script></body>
</html>
